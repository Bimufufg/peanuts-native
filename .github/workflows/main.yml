name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply user patches & Install git hooks
        run: |
          for p in *.patch; do [ -f "$p" ] && git apply "$p" || true; done
          ./peanuts/scripts/install-hooks.sh

      - name: Build Debug APK
        working-directory: android/app
        run: |
          ./gradlew assembleDebug -PusePackage=com.github.bylaws.peanuts.native -PusePackagingStyle=fake

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
