name: Build Peanuts Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android NDK, CMake & Ninja
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build python3-pip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Apply user patches & Install hooks
        run: |
          for p in *.patch; do [ -f "$p" ] && git apply "$p" || true; done
          sh peanuts/scripts/install-hooks.sh

      - name: Build Debug APK
        working-directory: android/app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export NX_PKG_NAME="com.github.bylaws.nxnative"
          export ORG_GRADLE_PROJECT_nxPackage="com.github.bylaws.nxnative"
          export ORG_GRADLE_PROJECT_nxPackEngine="fake"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew || true
          ./gradlew assembleDebug -PnxPackage=com.github.bylaws.nxnative -PnxPackEngine=fake --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-apk-full
          path: android/**/build/outputs/apk/**/*.apk
