name: Build Turbo3 SparkingZERO APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zsh and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Run apply-and-build-turbo3.zsh
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          chmod +x apply-and-build-turbo3.zsh
          zsh ./apply-and-build-turbo3.zsh .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peanuts-Turbo3-SparkingZERO-dev
          path: out/Peanuts-Turbo3-SparkingZERO-dev.apk
          
